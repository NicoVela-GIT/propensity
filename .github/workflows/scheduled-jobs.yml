name: Scheduled Alert System Jobs

on:
  schedule:
    # Update mortgage rates: Every Friday at 6 PM UTC (after FRED updates)
    - cron: '0 18 * * 5'
    
    # Generate alerts: EVERY HOUR (distributed batch processing)
    - cron: '0 * * * *'
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which job to run'
        required: true
        type: choice
        options:
          - update-rates
          - generate-alerts-batch
          - generate-alerts-all
          - both

jobs:
  update-mortgage-rates:
    name: Update Mortgage Rates
    runs-on: ubuntu-latest
    # Run on Friday schedule or manual trigger
    if: |
      github.event.schedule == '0 18 * * 5' || 
      github.event.inputs.job_type == 'update-rates' ||
      github.event.inputs.job_type == 'both'
    
    steps:
      - name: Trigger Rate Update Job
        run: |
          echo "🔄 Updating mortgage rates from FRED API..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/jobs/update-rates")
          
          if [ $response -eq 200 ]; then
            echo "✅ Mortgage rates updated successfully"
          else
            echo "❌ Failed to update mortgage rates (HTTP $response)"
            exit 1
          fi

  generate-alerts-hourly:
    name: Generate Alerts (Hourly Batch)
    runs-on: ubuntu-latest
    # Run on hourly schedule or manual trigger
    if: |
      github.event.schedule == '0 * * * *' || 
      github.event.inputs.job_type == 'generate-alerts-batch' ||
      github.event.inputs.job_type == 'both'
    
    steps:
      - name: Trigger Hourly Alert Generation
        run: |
          echo "🔔 Generating alerts for current hour batch..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/jobs/generate-alerts")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Alerts generated successfully"
            echo "$body" | jq -r '.message' || echo "$body"
          else
            echo "❌ Failed to generate alerts (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

  generate-alerts-all:
    name: Generate Alerts (All Properties)
    runs-on: ubuntu-latest
    # Only run on manual trigger for full processing
    if: github.event.inputs.job_type == 'generate-alerts-all'
    
    steps:
      - name: Trigger Full Alert Generation
        run: |
          echo "🔔 Generating alerts for ALL properties (legacy mode)..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/jobs/generate-alerts?all=true")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ $http_code -eq 200 ]; then
            echo "✅ Alerts generated successfully"
            echo "$body" | jq -r '.message' || echo "$body"
          else
            echo "❌ Failed to generate alerts (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [update-mortgage-rates, generate-alerts-hourly]
    if: failure()
    
    steps:
      - name: Send Notification
        run: |
          echo "⚠️ Alert system job failed!"
          echo "Check the Actions tab for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # You can add email/Slack notifications here
